<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker quizy</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12161c;
      --card: #1c232d;
      --line: #2c3644;
      --text: #e7edf5;
      --muted: #93a0b3;
      --accent: #3c82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    .links { display: grid; gap: 12px; }
    a {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 17px;
      font-weight: 650;
    }
    a:hover { border-color: var(--accent); }
    a span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main>
    <h1>Poker quizy</h1>
    <p>Wybierz quiz.</p>
    <div class="links">
      <a href="./quiz.html">Quiz bledow<span>Postflop: Twoje rozdania i poprawna decyzja</span></a>
      <a href="./mental-quiz.html">Quiz mentalny<span>Przygotowanie mentalne przed sesja</span></a>
    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz błędów</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12161c;
      --card: #1c232d;
      --line: #2c3644;
      --text: #e7edf5;
      --muted: #93a0b3;
      --accent: #3c82f6;
      --ok: #1f8a4d;
      --ok-bg: #163524;
      --bad: #c44747;
      --bad-bg: #3a1c1c;
      --street: #6ea0ff;
      --red: #e35d5d;
      --black: #e7edf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .meta { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
    }
    .spot-head {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.4;
    }
    .timeline {
      margin: 0 0 18px;
      display: grid;
      gap: 12px;
    }
    .street-block {
      background: #12161c;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .street-label {
      color: var(--street);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .pips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .pip {
      min-width: 46px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #1c232d;
      border: 1px solid var(--line);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      line-height: 1;
    }
    .pip.red { color: var(--red); }
    .pip.black { color: var(--black); }
    .pip.new { box-shadow: inset 0 0 0 1px var(--accent); }
    .street-action {
      margin: 0;
      line-height: 1.45;
      font-size: 15px;
    }
    .prompt { margin: 0 0 16px; font-size: 18px; font-weight: 650; }
    .answers { display: grid; gap: 10px; }
    button { font: inherit; cursor: pointer; }
    .answer {
      text-align: left;
      color: var(--text);
      background: #12161c;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
    }
    .answer:hover:not(:disabled) { border-color: var(--accent); }
    .answer:disabled { cursor: default; }
    .answer.good { background: var(--ok-bg); border-color: var(--ok); }
    .answer.bad { background: var(--bad-bg); border-color: var(--bad); }
    .result {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .verdict { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
    .verdict.good { color: #7ddea8; }
    .verdict.bad { color: #f0a0a0; }
    .why { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    .next {
      color: white;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 650;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Quiz błędów</h1>
    <p class="meta" id="meta"></p>
    <section class="card">
      <p class="spot-head" id="spotHead"></p>
      <div class="timeline" id="timeline"></div>
      <p class="prompt" id="prompt"></p>
      <div class="answers" id="answers"></div>
      <div class="result hidden" id="result">
        <p class="verdict" id="verdict"></p>
        <p class="why" id="why"></p>
        <button class="next" id="next" type="button">Następne rozdanie</button>
      </div>
    </section>
  </main>
  <script>
    const hands = [
  {
    "id": "ats-river",
    "head": "NL5 - BTN",
    "hero": [
      "As",
      "Ts"
    ],
    "board": {
      "flop": [
        "3d",
        "Ah",
        "9c"
      ],
      "turn": "Ks",
      "river": "Js"
    },
    "streets": [
      {
        "label": "Preflop",
        "text": "UTG1 otwiera do 2BB. Ty dociągasz."
      },
      {
        "label": "Flop",
        "text": "BB stawia 3.2BB, opener pasuje, ty dociągasz."
      },
      {
        "label": "Turn",
        "text": "BB stawia 9BB (około 70% puli), ty dociągasz."
      },
      {
        "label": "River",
        "text": "BB stawia 15.4BB (połowę puli)."
      }
    ],
    "prompt": "Co robisz na riverze?",
    "wrong": "Dociągam",
    "right": "Pasuję",
    "why": "Flop był tęczowy, więc przez dwie ulice nikt nie ciągnął koloru. Po królu i walecie BB value betuje AK, AQ, AJ, sety i dwie pary. To bije kickera 10. Słabsze asy, które jeszcze wygrywasz, na tej runie często czekają."
  },
  {
    "id": "ak-turn-flush",
    "head": "NL5 - UTG",
    "hero": [
      "Ac",
      "Ks"
    ],
    "board": {
      "flop": [
        "Qs",
        "2h",
        "5h"
      ],
      "turn": "Jh"
    },
    "streets": [
      {
        "label": "Preflop",
        "text": "Otwierasz do 2BB. BB dociąga."
      },
      {
        "label": "Flop",
        "text": "BB czeka, stawiasz 2.2BB, BB podbija do 8.8BB, ty dociągasz."
      },
      {
        "label": "Turn",
        "text": "Kolor się domyka. BB stawia 8.8BB w pulę około 22BB."
      }
    ],
    "prompt": "Co robisz na turnie?",
    "wrong": "Dociągam",
    "right": "Pasuję",
    "why": "Zostajesz z wysokim asem, bez pary i bez kiera. Drawy, przeciwko którym call na flopie miał sens, właśnie doszły. As, król i dziesiątka na strita przegrywają z kolorem. Został praktycznie jeden czysty out, A♥."
  },
  {
    "id": "qq-set-3bet",
    "head": "NL5 - BB",
    "hero": [
      "Qh",
      "Qd"
    ],
    "board": {
      "flop": [
        "4d",
        "Qs",
        "Js"
      ]
    },
    "streets": [
      {
        "label": "Preflop",
        "text": "UTG otwiera do 3BB. SB dociąga, ty dociągasz."
      },
      {
        "label": "Flop",
        "text": "SB czeka, stawiasz 3BB, UTG podbija do 8BB, SB pasuje."
      }
    ],
    "prompt": "Co robisz po jego raise?",
    "wrong": "Przebijam do 20BB",
    "right": "Dociągam 8BB",
    "why": "Masz set dam, nutsa na tym flopie. Draw na pik ma stąd około 35% i jest pod tobą. Trzybet do 20BB wyrzuca z puli pary i drawy, które chciały płacić. Call zostawia je na turn i river."
  },
  {
    "id": "ak-river-56-straight",
    "head": "NL5 - SB",
    "hero": [
      "Ad",
      "Kh"
    ],
    "board": {
      "flop": [
        "4h",
        "3c",
        "7c"
      ],
      "turn": "Qc",
      "river": "Ac"
    },
    "streets": [
      {
        "label": "Preflop",
        "text": "UTG1 otwiera do 3BB. Ty 3-betujesz do 9BB, UTG1 dociąga."
      },
      {
        "label": "Flop",
        "text": "Obaj czekacie."
      },
      {
        "label": "Turn",
        "text": "Stawiasz 9.6BB, UTG1 dociąga."
      },
      {
        "label": "River",
        "text": "Czekasz. UTG1 stawia 28.6BB."
      }
    ],
    "prompt": "Co robisz na riverze?",
    "wrong": "Dociągam, bo mam top parę z A/K",
    "right": "Pasuję",
    "why": "Najpierw board, potem Twoja ręka. Na 3-4-7 od flopa 56 jest gotowym stritem. Dostajesz asa i widzisz top parę, ale jego bet bije Cię właśnie przez 56 (i mocne kluby). Call tu płaci za zafiksowanie się na własnych kartach."
  }
];
    const SUIT = { s: "\u2660", h: "\u2665", d: "\u2666", c: "\u2663" };
    const RED = { h: true, d: true };

    const meta = document.getElementById("meta");
    const spotHead = document.getElementById("spotHead");
    const timeline = document.getElementById("timeline");
    const prompt = document.getElementById("prompt");
    const answers = document.getElementById("answers");
    const result = document.getElementById("result");
    const verdict = document.getElementById("verdict");
    const why = document.getElementById("why");
    const next = document.getElementById("next");

    function handsWord(n) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (n === 1) return "rozdanie";
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return "rozdania";
      return "rozda\u0144";
    }

    function parseCard(code) {
      const rank = code.slice(0, -1);
      const suit = code.slice(-1);
      return { text: rank + SUIT[suit], red: !!RED[suit] };
    }

    function makePip(code, isNew) {
      const card = parseCard(code);
      const el = document.createElement("span");
      el.className = "pip " + (card.red ? "red" : "black") + (isNew ? " new" : "");
      el.textContent = card.text;
      return el;
    }

    function cardsForStreet(hand, label) {
      if (label === "Preflop") return { codes: hand.hero.slice(), newFrom: 0 };
      const codes = hand.board.flop.slice();
      let newFrom = 0;
      if (label === "Flop") return { codes, newFrom: 0 };
      if (hand.board.turn) {
        codes.push(hand.board.turn);
        newFrom = 3;
      }
      if (label === "Turn") return { codes, newFrom };
      if (hand.board.river) {
        codes.push(hand.board.river);
        newFrom = codes.length - 1;
      }
      return { codes, newFrom };
    }

    function renderTimeline(hand) {
      timeline.replaceChildren();
      for (const street of hand.streets) {
        const block = document.createElement("div");
        block.className = "street-block";

        const label = document.createElement("div");
        label.className = "street-label";
        label.textContent = street.label;

        const pips = document.createElement("div");
        pips.className = "pips";
        const { codes, newFrom } = cardsForStreet(hand, street.label);
        codes.forEach((code, i) => pips.appendChild(makePip(code, i >= newFrom)));

        const action = document.createElement("p");
        action.className = "street-action";
        action.textContent = street.text;

        block.append(label, pips, action);
        timeline.appendChild(block);
      }
    }

    let lastId = null;

    function pickHand() {
      const pool = hands.length === 1 ? hands : hands.filter((hand) => hand.id !== lastId);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function show(hand) {
      lastId = hand.id;
      meta.textContent = "Pula: " + hands.length + " " + handsWord(hands.length);
      spotHead.textContent = hand.head;
      renderTimeline(hand);
      prompt.textContent = hand.prompt;
      result.classList.add("hidden");
      answers.replaceChildren();

      const choices = [
        { text: hand.wrong, correct: false },
        { text: hand.right, correct: true }
      ].sort(() => Math.random() - 0.5);

      for (const choice of choices) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.textContent = choice.text;
        button.addEventListener("click", () => grade(hand, choice.correct, button));
        answers.appendChild(button);
      }
    }

    function grade(hand, correct, chosen) {
      for (const button of answers.querySelectorAll("button")) button.disabled = true;
      chosen.classList.add(correct ? "good" : "bad");
      if (!correct) {
        for (const button of answers.querySelectorAll("button")) {
          if (button.textContent === hand.right) button.classList.add("good");
        }
      }
      verdict.textContent = correct ? "Dobrze." : "To by\u0142 ten b\u0142\u0105d.";
      verdict.className = "verdict " + (correct ? "good" : "bad");
      why.textContent = hand.why;
      result.classList.remove("hidden");
    }

    next.addEventListener("click", () => show(pickHand()));
    show(pickHand());
  </script>
</body>
</html>
